version: '3.8'

services:
  glpi-prod-db:
    image: mariadb:10.11
    container_name: glpi-prod-db
    hostname: glpi-prod-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_pass_prod_2024
      MARIADB_DATABASE: glpidb_prod
      MARIADB_USER: glpi_user_prod
      MARIADB_PASSWORD: glpi_pass_prod_2024
    volumes:
      - glpi-prod-db-data:/var/lib/mysql
    networks:
      - glpi-prod-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5

  glpi-prod-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mostakimidlc/glpi:${IMAGE_TAG:-latest}
    container_name: glpi-prod-app
    hostname: glpi-prod-app
    restart: unless-stopped
    ports:
      - "8090:80"
    environment:
      - DB_HOST=glpi-prod-db
      - DB_NAME=glpidb_prod
      - DB_USER=glpi_user_prod
      - DB_PASSWORD=glpi_pass_prod_2024
    volumes:
      - glpi-prod-config:/var/www/glpi/config
      - glpi-prod-files:/var/www/glpi/files
      - glpi-prod-marketplace:/var/www/glpi/marketplace
      - glpi-prod-plugins:/var/www/glpi/plugins
    depends_on:
      glpi-prod-db:
        condition: service_healthy
    networks:
      - glpi-prod-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  glpi-prod-network:
    name: glpi-prod-network
    driver: bridge

volumes:
  glpi-prod-db-data:
    name: glpi-prod-db-data
  glpi-prod-config:
    name: glpi-prod-config
  glpi-prod-files:
    name: glpi-prod-files
  glpi-prod-marketplace:
    name: glpi-prod-marketplace
  glpi-prod-plugins:
    name: glpi-prod-plugins
