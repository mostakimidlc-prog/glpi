version: '3.8'

services:
  # MariaDB Database (>= 10.6 requirement)
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: glpi_root_2024
      MYSQL_DATABASE: glpidb
      MYSQL_USER: glpi_user
      MYSQL_PASSWORD: glpi_pass_2024
      TZ: Asia/Dhaka
    volumes:
      - glpi-db-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - glpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GLPI Application (PHP 8.2)
  glpi-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: glpi-container
    ports:
      - "8088:80"
    environment:
      - TZ=Asia/Dhaka
    volumes:
      - glpi-files:/var/www/html/files
      - glpi-config:/var/www/html/config
      - glpi-marketplace:/var/www/html/marketplace
    depends_on:
      glpi-db:
        condition: service_healthy
    networks:
      - glpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  glpi-network:
    driver: bridge

volumes:
  glpi-db-data:
    driver: local
  glpi-files:
    driver: local
  glpi-config:
    driver: local
  glpi-marketplace:
    driver: local
