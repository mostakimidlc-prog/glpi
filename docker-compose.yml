version: '3.8'

services:
  # MariaDB Database (>= 10.6 requirement)
  glpi-db:
    image: mariadb:10.11
    container_name: glpi-mysql
    command: --default-authentication-plugin=mysql_native_password
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MYSQL_ROOT_PASSWORD: glpi_root_2024
      MYSQL_DATABASE: glpidb
      MYSQL_USER: glpi_user
      MYSQL_PASSWORD: glpi_pass_2024
      TZ: Asia/Dhaka
    volumes:
      - glpi-db-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - glpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  glpi-redis:
    image: redis:7-alpine
    container_name: glpi-redis
    hostname: glpi-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - glpi-redis-data:/data
    networks:
      - glpi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GLPI Application (PHP 8.2)
  glpi-app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: glpi-container
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8088:80"
    environment:
      - TZ=Asia/Dhaka
      - REDIS_HOST=glpi-redis
      - REDIS_PORT=6379
    volumes:
      - glpi-files:/var/www/glpi/files
      - glpi-config:/var/www/glpi/config
      - glpi-marketplace:/var/www/glpi/marketplace
    depends_on:
      glpi-db:
        condition: service_healthy
      glpi-redis:
        condition: service_healthy
    networks:
      - glpi-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  glpi-network:
    driver: bridge

volumes:
  glpi-db-data:
    driver: local
  glpi-redis-data:
    driver: local
  glpi-files:
    driver: local
  glpi-config:
    driver: local
  glpi-marketplace:
    driver: local
