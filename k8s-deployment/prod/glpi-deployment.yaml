apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi
  namespace: glpi-production
  labels:
    app: glpi
spec:
  replicas: 3  # 3 replicas as requested
  selector:
    matchLabels:
      app: glpi
  template:
    metadata:
      labels:
        app: glpi
    spec:
      containers:
      - name: glpi
        image: mostakimidlc/glpi:latest
        imagePullPolicy: Always  # Always pull latest image
        ports:
        - containerPort: 80
          name: http
        env:
        - name: GLPI_DB_HOST
          value: "mysql.glpi-production.svc.cluster.local"
        - name: GLPI_DB_NAME
          value: "glpi"
        - name: GLPI_DB_USER
          value: "glpi_user"
        - name: GLPI_DB_PASSWORD
          value: "glpi_pass_2024"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: glpi
  namespace: glpi-production
spec:
  type: NodePort
  selector:
    app: glpi
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30100  # Different port from your dev (8088) and prod (8090)
    name: http
