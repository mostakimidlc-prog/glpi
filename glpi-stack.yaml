# glpi-stack.yaml
---
# STORAGE DEFINITIONS
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/mostakim/projects/glpi/mysql-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-files-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/home/mostakim/projects/glpi/glpi-files"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# 1. MariaDB Database
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-db
spec:
  selector:
    matchLabels:
      app: glpi-db
  template:
    metadata:
      labels:
        app: glpi-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MARIADB_ROOT_PASSWORD
          value: "root_pass"
        - name: MARIADB_DATABASE
          value: "glpidb"
        - name: MARIADB_USER
          value: "glpi_user"
        - name: MARIADB_PASSWORD
          value: "glpi_pass"
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: glpi-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-db-service
spec:
  selector:
    app: glpi-db
  ports:
    - port: 3306
---
# 2. Redis Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-redis
spec:
  selector:
    matchLabels:
      app: glpi-redis
  template:
    metadata:
      labels:
        app: glpi-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-redis-service
spec:
  selector:
    app: glpi-redis
  ports:
    - port: 6379
---
# 3. GLPI Web App
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glpi
  template:
    metadata:
      labels:
        app: glpi
    spec:
      containers:
      - name: glpi
        image: localhost:5000/glpi:latest
        imagePullPolicy: Always
        env:
        # REPLACE THE PROXY URL BELOW WITH YOUR ACTUAL CORPORATE PROXY
        - name: http_proxy
          value: "http://192.168.111.21:8080"
        - name: https_proxy
          value: "http://192.168.111.21:8080"
        # THIS PREVENTS INTERNAL TRAFFIC FROM GOING THROUGH THE PROXY
        - name: no_proxy
          value: "localhost,127.0.0.1,glpi-db-service,glpi-redis-service,10.42.0.0/16"
        # FIX FOR THE DUBIOUS OWNERSHIP ERROR
        - name: GIT_SAFE_DIR
          value: "true"
        ports:
        - containerPort: 80
        volumeMounts:
        - name: glpi-storage
          mountPath: /var/www/html/files
      volumes:
      - name: glpi-storage
        persistentVolumeClaim:
          claimName: glpi-files-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-service
spec:
  type: NodePort
  selector:
    app: glpi
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30096
