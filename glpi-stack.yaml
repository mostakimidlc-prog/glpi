# 1. STORAGE DEFINITIONS (Persistent Volumes & Claims)
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-db-pv
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: "/home/mostakim/projects/pvc/glpi/mysql-data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-db-pvc
spec:
  storageClassName: manual
  volumeName: glpi-db-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-files-pv
spec:
  storageClassName: manual
  capacity:
    storage: 2Gi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: "/home/mostakim/projects/pvc/glpi/files"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-files-pvc
spec:
  storageClassName: manual
  volumeName: glpi-files-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-config-pv
spec:
  storageClassName: manual
  capacity:
    storage: 500Mi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: "/home/mostakim/projects/pvc/glpi/config"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-config-pvc
spec:
  storageClassName: manual
  volumeName: glpi-config-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: glpi-plugins-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  hostPath:
    path: "/home/mostakim/projects/glpi/plugins"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glpi-plugins-pvc
spec:
  storageClassName: manual
  volumeName: glpi-plugins-pv
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
# 2. MariaDB Database
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-db
spec:
  selector:
    matchLabels:
      app: glpi-db
  template:
    metadata:
      labels:
        app: glpi-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11
        env:
        - name: MARIADB_ROOT_PASSWORD
          value: "root_pass"
        - name: MARIADB_DATABASE
          value: "glpidb"
        - name: MARIADB_USER
          value: "glpi_user"
        - name: MARIADB_PASSWORD
          value: "glpi_pass"
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: glpi-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-db-service
spec:
  selector:
    app: glpi-db
  ports:
    - port: 3306

---
# 3. Redis Cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-redis
spec:
  selector:
    matchLabels:
      app: glpi-redis
  template:
    metadata:
      labels:
        app: glpi-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-redis-service
spec:
  selector:
    app: glpi-redis
  ports:
    - port: 6379

---
# 4. GLPI Web App (15 MINUTE INITIALIZATION FIX)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glpi-deployment
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: glpi
  template:
    metadata:
      labels:
        app: glpi
    spec:
      containers:
      - name: glpi
        image: localhost:5000/mostakimidlc/glpi:latest
        imagePullPolicy: Always
        env:
        - name: REDIS_HOST
          value: "glpi-redis-service"
        ports:
        - containerPort: 80

        # --- THE 15-MINUTE WAIT FIX ---
        # 1. Startup Probe: Holds the door open for the initial slow install.
        # Calculation: 90 failures * 10s period = 900s (15 Minutes)
        startupProbe:
          httpGet:
            path: /index.php
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 90 

        # 2. Readiness Probe: Handles traffic once startup is finished.
        readinessProbe:
          httpGet:
            path: /index.php
            port: 80
          periodSeconds: 15
          failureThreshold: 5 

        # 3. Liveness Probe: Monitors for crashes AFTER the 15-minute boot.
        livenessProbe:
          httpGet:
            path: /index.php
            port: 80
          periodSeconds: 30
          failureThreshold: 3

        volumeMounts:
        - name: glpi-storage
          mountPath: /var/www/glpi/files
        - name: glpi-config-storage
          mountPath: /var/www/glpi/config
        - name: glpi-plugins-storage
          mountPath: /var/www/glpi/plugins
      volumes:
      - name: glpi-storage
        persistentVolumeClaim:
          claimName: glpi-files-pvc
      - name: glpi-config-storage
        persistentVolumeClaim:
          claimName: glpi-config-pvc
      - name: glpi-plugins-storage
        persistentVolumeClaim:
          claimName: glpi-plugins-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: glpi-service
spec:
  type: NodePort
  selector:
    app: glpi
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30096
